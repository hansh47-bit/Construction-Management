spring.application.name=construction-management-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/construction_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.contract-file.upload-dir=uploads/contracts
app.site-record.upload-dir=uploads/site-records

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.bootstrap.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.demo-data.enabled=false

# Approval emails remain off until the Gmail account and office access URL are configured.
app.approval-email.enabled=${APPROVAL_EMAIL_ENABLED:false}
app.approval-email.scheduler-enabled=true
app.approval-email.from=${GMAIL_ADDRESS:}
app.approval-email.base-url=${APP_BASE_URL:}
app.approval-email.max-attempts=5
app.approval-email.poll-delay-ms=15000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_ADDRESS:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=${app.approval-email.enabled}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
