# Loaded in addition to the packaged application.properties and prod profile.
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.web.resources.static-locations=file:${APP_HOME}/frontend/
spring.web.resources.cache.cachecontrol.no-store=true

# A single application owns this embedded database. No AUTO_SERVER hostname dependency.
spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR}/data/construction_management;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
app.contract-file.upload-dir=${APP_DATA_DIR}/uploads/contracts
app.site-record.upload-dir=${APP_DATA_DIR}/uploads/site-records
app.execution-budget-attachment.upload-dir=${APP_DATA_DIR}/uploads/execution-budget-approvals
app.vendor-comparison-attachment.upload-dir=${APP_DATA_DIR}/uploads/vendor-comparisons
spring.servlet.multipart.location=${APP_DATA_DIR}/tmp

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
logging.file.name=${APP_DATA_DIR}/logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
